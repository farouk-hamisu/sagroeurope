<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deposits — Sagroeurope Admin</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logos/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="page-loader" id="page-loader" role="status" aria-live="polite">
    <div class="pl-inner">
      <div class="pl-orbit">
        <span class="pl-ring"></span>
        <span class="pl-ring pl-ring--2"></span>
        <span class="pl-ring pl-ring--3"></span>
        <span class="pl-core"></span>
      </div>
      <div class="pl-track"><span class="pl-progress"></span></div>
      <p class="pl-status" id="pl-status">Loading</p>
    </div>
  </div>
  <div id="page-root">
    <div class="card mb-3">
      <div class="filter-bar">
        <div class="grow"><input type="search" class="input" id="f-search" placeholder="Search reference, user, asset..."></div>
        <select class="select" id="f-status"><option value="">All statuses</option></select>
        <select class="select" id="f-type"><option value="">All types</option><option value="fiat">Fiat</option><option value="crypto">Crypto</option></select>
        <select class="select" id="f-asset"><option value="">All assets</option></select>
      </div>
      <div class="table-wrap"><div id="deposit-table"><div class="loading-block"><div class="spinner"></div><span>Loading deposits...</span></div></div></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/admin/auth.js"></script>
  <script src="../js/admin/deposits.js"></script>
</body>
</html>
